<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEngine Demo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; overflow: hidden; cursor: crosshair; }
    canvas { display: block; }

    /* ── Panel ── */
    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 236px;
      background: rgba(8, 8, 12, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      color: #fff;
      font: 12px/1.5 system-ui, -apple-system, sans-serif;
      overflow: hidden;
      z-index: 10;
      user-select: none;
    }

    .panel-header {
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a78bfa;
      flex-shrink: 0;
    }

    .panel-section {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.45);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .section-label span {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 7px;
      color: #fff;
      font: 12px system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
    }
    .btn:disabled { opacity: 0.45; cursor: default; }

    #file-name {
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #a78bfa;
      cursor: pointer;
    }

    .hint {
      color: rgba(255, 255, 255, 0.22);
      font-size: 10px;
    }

    .panel-footer {
      padding: 9px 16px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Corner hint ── */
    #hint {
      position: fixed;
      bottom: 14px;
      left: 18px;
      color: rgba(255, 255, 255, 0.2);
      font: 11px/1.7 monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="panel">
    <div class="panel-header">PEngine</div>

    <div class="panel-section">
      <div class="section-label">Image</div>
      <input type="file" id="file-input" accept=".png,.jpg,.jpeg,image/png,image/jpeg" hidden>
      <button id="upload-btn" class="btn">↑ Upload Image</button>
      <div id="file-name">No image · fountain mode</div>
    </div>

    <div class="panel-section">
      <div class="section-label">
        Brightness Threshold
        <span id="threshold-pct">0%</span>
      </div>
      <input type="range" id="threshold" min="0" max="100" value="0">
      <div class="hint">Raise to spawn only brighter pixels</div>
    </div>

    <div class="panel-footer">
      <span id="count">0</span> particles active
    </div>
  </div>

  <div id="hint">
    Click canvas to burst
  </div>

  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
